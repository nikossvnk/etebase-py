[package]
name = "etebase-python"
description = "Python bindings to etebase-rs"
homepage = "https://github.com/nikossvnk/etebase-py/"
repository = "https://github.com/nikossvnk/etebase-py/"
version = "0.33.0"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2018"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
name = "etebase_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
openssl = { version = "0.10.55", features = ["vendored"] }
etebase = { git = "https://github.com/nikossvnk/etebase-rs", rev = "3ae5348bdf29aaa2f4733f3b88d2bb5b27d330e3" }
